name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: Lint
        run: ruff check backend
      - name: Tests
        run: pytest backend
      - name: Sample messages get the verdicts the manifest expects
        run: unhook samples
      - name: The case-note checker catches every seeded fabrication
        run: unhook notes-check
      - name: Samples regenerate byte for byte
        run: |
          python scripts/make_samples.py
          git diff --exit-code samples

  sandbox:
    name: Link sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sandbox/pyproject.toml
      - run: pip install -e "sandbox[browser,dev]"
      - name: Install Chromium so the browser-mode tests run instead of skipping
        run: playwright install --with-deps chromium
      - run: ruff check sandbox
      - run: pytest sandbox

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build

  compose:
    name: Compose stack
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Validate every profile
        run: docker compose --profile sandbox --profile ingest config -q
      - name: Build the images
        run: docker compose --profile sandbox build
      - name: Bring up the core stack
        run: docker compose up -d --wait --wait-timeout 180 postgres redis api worker
      - name: Report a sample and read back the verdict
        run: |
          id=$(curl -fsS -F "file=@samples/01-m365-password-expiry.eml" -F "reporter=ci@example.org" localhost:8000/api/reports | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 30); do
            status=$(curl -fsS "localhost:8000/api/reports/$id" | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            [ "$status" = "done" ] && break
            sleep 2
          done
          curl -fsS "localhost:8000/api/reports/$id" | tee /dev/stderr | python3 -c 'import sys,json; r=json.load(sys.stdin); assert r["status"]=="done", r'
          curl -fsS localhost:8000/api/cases | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["total"]==1, d'
      - name: The sandbox proxy refuses a private address
        run: |
          docker compose --profile sandbox up -d --wait --wait-timeout 180 egress sandbox
          # From inside the jail, the metadata address must be refused even though it is a valid target.
          docker compose exec -T sandbox python3 - <<'PY'
          import httpx
          r = httpx.post("http://127.0.0.1:8080/trace", json={"url": "http://169.254.169.254/latest/meta-data/"}, timeout=30)
          body = r.json()
          print(body)
          assert body["error"].startswith("refused"), body
          PY
      - name: Logs on failure
        if: failure()
        run: docker compose --profile sandbox logs --no-color --tail=80
