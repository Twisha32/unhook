name: Evaluate on public corpora

# Run this by hand from the Actions tab. It downloads the Nazario phishing archives and the
# SpamAssassin ham corpus on a GitHub runner, trains and evaluates on a sender-grouped split,
# and publishes the report and the trained model to the eval-results branch. The corpora are
# never committed.

on:
  workflow_dispatch:
    inputs:
      prevalence:
        description: Assumed share of reports that are phishing, for cost and precision figures
        default: "0.25"
      seed:
        description: Split seed
        default: "7"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e backend
      - name: Fetch the corpora
        run: unhook corpora fetch --dest data/corpora
      - name: Train and evaluate
        run: |
          mkdir -p out
          unhook eval --corpus real --data data/corpora \
            --prevalence "${{ inputs.prevalence }}" --seed "${{ inputs.seed }}" \
            --out out/report.json --write-model out/model.json | tee out/summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: out/
      - name: Publish to the eval-results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan eval-results
          git rm -rf --quiet . || true
          cp out/report.json out/model.json out/summary.txt .
          printf '# Evaluation results\n\nGenerated by the "Evaluate on public corpora" workflow, run %s.\nSee summary.txt, then report.json for the full numbers.\n' "${{ github.run_id }}" > README.md
          git add report.json model.json summary.txt README.md
          git commit --quiet -m "Evaluation results from run ${{ github.run_id }}"
          git push --force origin eval-results
