[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unhook-sandbox"
version = "0.1.0"
description = "Egress-restricted link tracer for Unhook"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
unhook-sandbox = "unhook_sandbox.server:main"
unhook-proxy = "unhook_sandbox.proxy:main"

[tool.setuptools]
packages = ["unhook_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs a Playwright Chromium install"]

[tool.ruff]
line-length = 130
target-version = "py311"
