<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Unhook: open-source phishing triage for teams without a SOC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#0c1329"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b91ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowA" cx="12%" cy="0%" r="60%">
      <stop offset="0" stop-color="#7c83ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7c83ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="92%" cy="100%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="320" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="round"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>

  <style>
    .t { font-family: "Space Grotesk", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .u { font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .flow { stroke-dasharray: 5 9; animation: flow 1.6s linear infinite; }
    .dot { animation: travel 4.2s cubic-bezier(.5,0,.5,1) infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 4.2s ease-out infinite; }
    .ring { stroke-dasharray: 0 220; animation: fill 4.2s ease-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 78% { opacity: 1; } 88%, 100% { transform: translateX(330px); opacity: 0; } }
    @keyframes pulse { 0%, 70% { transform: scale(1); opacity: 0; } 78% { opacity: .55; } 100% { transform: scale(2.1); opacity: 0; } }
    @keyframes fill { 0%, 62% { stroke-dasharray: 0 220; } 92%, 100% { stroke-dasharray: 150 220; } }
    @media (prefers-reduced-motion: reduce) { .flow, .dot, .pulse, .ring { animation: none; } .ring { stroke-dasharray: 150 220; } .dot { opacity: 0; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#glowA)"/>
    <rect width="1280" height="320" fill="url(#glowB)"/>
    <rect width="1280" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="319" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>

  <!-- mark -->
  <g transform="translate(70 78)">
    <rect width="92" height="92" rx="25" fill="#0b1020" stroke="#ffffff" stroke-opacity=".14"/>
    <g transform="scale(1.4375)">
      <path d="M22 14v20a10 10 0 0 0 20 0V22" fill="none" stroke="#7c83ff" stroke-width="6" stroke-linecap="round" filter="url(#blur)" opacity=".7"/>
      <path d="M22 14v20a10 10 0 0 0 20 0V22" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="42" cy="14" r="4.2" fill="#22d3ee"/>
    </g>
  </g>

  <text x="190" y="140" class="t" font-size="76" font-weight="700" fill="#e9edfa" letter-spacing="-2.5">Unhook</text>
  <text x="192" y="184" class="u" font-size="22" fill="#9ba5c4">Open-source phishing triage for teams without a SOC.</text>

  <g class="u" font-size="14" font-weight="600">
    <g transform="translate(192 214)">
      <rect width="150" height="32" rx="16" fill="#7c83ff" fill-opacity=".14" stroke="#7c83ff" stroke-opacity=".4"/>
      <text x="75" y="21" text-anchor="middle" fill="#b9bdff">41 plain rules</text>
    </g>
    <g transform="translate(354 214)">
      <rect width="170" height="32" rx="16" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".35"/>
      <text x="85" y="21" text-anchor="middle" fill="#8be9fb">ATT&amp;CK T1566</text>
    </g>
    <g transform="translate(536 214)">
      <rect width="178" height="32" rx="16" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/>
      <text x="89" y="21" text-anchor="middle" fill="#8bf0c4">passive by design</text>
    </g>
  </g>

  <!-- pipeline -->
  <g transform="translate(800 0)">
    <line x1="40" y1="148" x2="370" y2="148" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <line x1="40" y1="148" x2="370" y2="148" stroke="url(#accent)" stroke-width="2" stroke-opacity=".8" class="flow"/>
    <g class="dot"><circle cx="40" cy="148" r="5" fill="#fff"/><circle cx="40" cy="148" r="12" fill="#7c83ff" opacity=".35" filter="url(#blur)"/></g>

    <g class="u" font-size="13" fill="#9ba5c4" text-anchor="middle">
      <g transform="translate(40 148)"><circle r="19" fill="#0b1020" stroke="#7c83ff" stroke-opacity=".7" stroke-width="1.6"/>
        <path d="M-8-5h16v10h-16zM-8-5l8 6 8-6" fill="none" stroke="#b9bdff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text y="44">report</text></g>
      <g transform="translate(150 148)"><circle r="19" fill="#0b1020" stroke="#7c83ff" stroke-opacity=".7" stroke-width="1.6"/>
        <path d="M-6-8h12M-6 0h12M-6 8h7" fill="none" stroke="#b9bdff" stroke-width="1.8" stroke-linecap="round"/><text y="44">parse</text></g>
      <g transform="translate(260 148)"><circle r="19" fill="#0b1020" stroke="#22d3ee" stroke-opacity=".7" stroke-width="1.6"/>
        <path d="M-8 7V1m5 6V-4m5 11V-8m5 15V-1" fill="none" stroke="#8be9fb" stroke-width="2" stroke-linecap="round"/><text y="44">score</text></g>
      <g transform="translate(370 148)">
        <circle r="19" fill="#3ddc97" class="pulse"/>
        <circle r="24" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="4"/>
        <circle r="24" fill="none" stroke="#3ddc97" stroke-width="4" stroke-linecap="round" transform="rotate(-90)" class="ring"/>
        <circle r="19" fill="#0b1020"/>
        <path d="m-7 0 5 5 9-10" fill="none" stroke="#3ddc97" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text y="50">verdict</text></g>
    </g>
    <text x="205" y="244" text-anchor="middle" class="u" font-size="12" fill="#646f8f" letter-spacing=".12em">MILLISECONDS OFFLINE · SECONDS WITH LIVE LOOKUPS</text>
  </g>
</svg>
