<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-label="Unhook architecture: report intake, analysis, scoring, outputs, an isolated link sandbox and an evaluation harness">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset="1" stop-color="#0c1329"/></linearGradient>
  <radialGradient id="glow" cx="10%" cy="0%" r="55%"><stop offset="0" stop-color="#7c83ff" stop-opacity=".25"/><stop offset="1" stop-color="#7c83ff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  <marker id="a-7c83ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#7c83ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-22d3ee" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-3ddc97" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#3ddc97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-ffb547" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#ffb547" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <clipPath id="round"><rect width="1280" height="760" rx="24"/></clipPath>
</defs>
<style>
  text { font-family: "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  .title { font-family: "Space Grotesk","Inter",ui-sans-serif,system-ui,sans-serif; font-size: 22px; font-weight: 700; fill: #e9edfa; letter-spacing: -.02em; }
  .h { font-size: 14.5px; font-weight: 600; fill: #e9edfa; }
  .s { font-size: 11.5px; fill: #9ba5c4; }
  .g { font-size: 11px; font-weight: 700; letter-spacing: .14em; }
</style>
<g clip-path="url(#round)">
  <rect width="1280" height="760" fill="url(#bg)"/><rect width="1280" height="760" fill="url(#glow)"/><rect width="1280" height="760" fill="url(#grid)"/>
</g>
<rect x=".5" y=".5" width="1279" height="759" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
<text x="40" y="52" class="title">How a report becomes a verdict</text>
<text x="40" y="74" class="s">The sandbox is opt-in. It has no route to the internet except through its own egress proxy.</text>

<rect x="30" y="100" width="450" height="190" rx="18" fill="#7c83ff" fill-opacity=".035" stroke="#7c83ff" stroke-opacity=".45" stroke-dasharray="6 6"/><text x="48" y="126" class="g" fill="#7c83ff">INTAKE</text>
<g transform="translate(50 134)"><rect width="190" height="66" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="42" rx="1.5" fill="#7c83ff"/><text x="16" y="26" class="h">Report button</text><text x="16" y="46" class="s">add-in, or forward to a</text><text x="16" y="62" class="s">mailbox</text></g>
<g transform="translate(50 214)"><rect width="190" height="66" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="42" rx="1.5" fill="#7c83ff"/><text x="16" y="26" class="h">Shared mailbox</text><text x="16" y="46" class="s">polled over IMAP</text></g>
<g transform="translate(280 134)"><rect width="180" height="66" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="42" rx="1.5" fill="#7c83ff"/><text x="16" y="26" class="h">FastAPI</text><text x="16" y="46" class="s">POST /api/reports,</text><text x="16" y="62" class="s">202 straight back</text></g>
<g transform="translate(280 214)"><rect width="180" height="66" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="42" rx="1.5" fill="#7c83ff"/><text x="16" y="26" class="h">Celery worker</text><text x="16" y="46" class="s">Redis queue, retries</text></g>
<path d="M240 167 H280" fill="none" stroke="#7c83ff" stroke-opacity=".75" stroke-width="1.8" marker-end="url(#a-7c83ff)"/>
<path d="M240 247 H280" fill="none" stroke="#7c83ff" stroke-opacity=".75" stroke-width="1.8" marker-end="url(#a-7c83ff)"/>
<path d="M370 200 V214" fill="none" stroke="#7c83ff" stroke-opacity=".75" stroke-width="1.8" marker-end="url(#a-7c83ff)"/>
<rect x="520" y="100" width="440" height="330" rx="18" fill="#7c83ff" fill-opacity=".035" stroke="#7c83ff" stroke-opacity=".45" stroke-dasharray="6 6"/><text x="538" y="126" class="g" fill="#7c83ff">ANALYSIS: NOTHING HERE VISITS A LINK</text>
<g transform="translate(536 134)"><rect width="200" height="62" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="38" rx="1.5" fill="#7c83ff"/><text x="16" y="26" class="h">Parse and authenticate</text><text x="16" y="46" class="s">SPF, DKIM, DMARC, Reply-To</text></g>
<g transform="translate(744 134)"><rect width="200" height="62" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="38" rx="1.5" fill="#7c83ff"/><text x="16" y="26" class="h">Identity</text><text x="16" y="46" class="s">spoofed names, lookalikes</text></g>
<g transform="translate(536 210)"><rect width="200" height="62" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="38" rx="1.5" fill="#7c83ff"/><text x="16" y="26" class="h">Links</text><text x="16" y="46" class="s">unwrap scanners, defang</text></g>
<g transform="translate(744 210)"><rect width="200" height="62" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="38" rx="1.5" fill="#7c83ff"/><text x="16" y="26" class="h">Attachments</text><text x="16" y="46" class="s">file type, macros, hashes</text></g>
<g transform="translate(536 286)"><rect width="200" height="62" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="38" rx="1.5" fill="#22d3ee"/><text x="16" y="26" class="h">Passive intel</text><text x="16" y="46" class="s">URLhaus, MalwareBazaar, RDAP</text></g>
<g transform="translate(744 286)"><rect width="200" height="62" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="38" rx="1.5" fill="#7c83ff"/><text x="16" y="26" class="h">Wording</text><text x="16" y="46" class="s">urgency, credential asks, QR</text></g>
<g transform="translate(536 366)"><rect width="408" height="52" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="28" rx="1.5" fill="#3ddc97"/><text x="16" y="26" class="h">Score</text><text x="16" y="46" class="s">41 rules, noisy-OR across groups, blended with a logistic model</text></g>
<path d="M460 247 H520" fill="none" stroke="#7c83ff" stroke-opacity=".75" stroke-width="1.8" marker-end="url(#a-7c83ff)"/>
<rect x="1000" y="100" width="250" height="330" rx="18" fill="#3ddc97" fill-opacity=".035" stroke="#3ddc97" stroke-opacity=".45" stroke-dasharray="6 6"/><text x="1018" y="126" class="g" fill="#3ddc97">OUTPUTS</text>
<g transform="translate(1018 134)"><rect width="214" height="54" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="30" rx="1.5" fill="#3ddc97"/><text x="16" y="26" class="h">Verdict and micro-lesson</text><text x="16" y="46" class="s">back to the reporter</text></g>
<g transform="translate(1018 200)"><rect width="214" height="54" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="30" rx="1.5" fill="#3ddc97"/><text x="16" y="26" class="h">Case queue</text><text x="16" y="46" class="s">Postgres, one case per message</text></g>
<g transform="translate(1018 266)"><rect width="214" height="54" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="30" rx="1.5" fill="#3ddc97"/><text x="16" y="26" class="h">Blocklist</text><text x="16" y="46" class="s">txt, RPZ, CSV, JSON</text></g>
<g transform="translate(1018 332)"><rect width="214" height="66" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="42" rx="1.5" fill="#3ddc97"/><text x="16" y="26" class="h">Case note</text><text x="16" y="46" class="s">template, or an LLM held to</text><text x="16" y="62" class="s">cited evidence and checked</text></g>
<path d="M960 392 C985 392 990 161 1018 161" fill="none" stroke="#3ddc97" stroke-opacity=".75" stroke-width="1.8" marker-end="url(#a-3ddc97)"/>
<path d="M960 392 C985 392 990 227 1018 227" fill="none" stroke="#3ddc97" stroke-opacity=".75" stroke-width="1.8" marker-end="url(#a-3ddc97)"/>
<path d="M960 392 C985 392 990 293 1018 293" fill="none" stroke="#3ddc97" stroke-opacity=".75" stroke-width="1.8" marker-end="url(#a-3ddc97)"/>
<path d="M960 392 C985 392 990 365 1018 365" fill="none" stroke="#3ddc97" stroke-opacity=".75" stroke-width="1.8" marker-end="url(#a-3ddc97)"/>
<g transform="translate(1018 454)"><rect width="214" height="62" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="38" rx="1.5" fill="#ffb547"/><text x="16" y="26" class="h">React dashboard</text><text x="16" y="46" class="s">queue, evidence, evaluation</text></g>
<path d="M1125 430 V454" fill="none" stroke="#ffb547" stroke-opacity=".75" stroke-width="1.8" marker-end="url(#a-ffb547)"/>
<rect x="520" y="464" width="440" height="262" rx="18" fill="#22d3ee" fill-opacity=".035" stroke="#22d3ee" stroke-opacity=".45" stroke-dasharray="6 6"/><text x="538" y="490" class="g" fill="#22d3ee">ISOLATED LINK SANDBOX (OPT-IN)</text>
<g transform="translate(536 500)"><rect width="200" height="84" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="60" rx="1.5" fill="#22d3ee"/><text x="16" y="26" class="h">Tracer</text><text x="16" y="46" class="s">follows redirects, reads the</text><text x="16" y="62" class="s">landing page. Optional</text><text x="16" y="78" class="s">Chromium mode.</text></g>
<g transform="translate(744 500)"><rect width="200" height="84" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="60" rx="1.5" fill="#22d3ee"/><text x="16" y="26" class="h">Egress proxy</text><text x="16" y="46" class="s">resolves DNS itself, allows</text><text x="16" y="62" class="s">public IPs and web ports</text><text x="16" y="78" class="s">only.</text></g>
<path d="M736 542 H744" fill="none" stroke="#22d3ee" stroke-opacity=".75" stroke-width="1.8" marker-end="url(#a-22d3ee)"/>
<path d="M736 542 H744" fill="none" stroke="#22d3ee" stroke-opacity=".75" stroke-width="1.8" marker-end="url(#a-22d3ee)"/>
<text x="740" y="610" class="s" fill="#8be9fb" text-anchor="middle">read-only filesystem, no capabilities, internal network</text>
<text x="740" y="630" class="s" fill="#9ba5c4" text-anchor="middle">private, loopback, link-local and metadata addresses refused</text>
<g transform="translate(640 660)"><rect width="200" height="44" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="20" rx="1.5" fill="#646f8f"/><text x="16" y="27.0" class="h">Public internet</text></g>
<path d="M844 584 C844 625 790 625 790 660" fill="none" stroke="#22d3ee" stroke-opacity=".75" stroke-width="1.8" marker-end="url(#a-22d3ee)"/>
<path d="M636 418 V500" fill="none" stroke="#22d3ee" stroke-opacity=".75" stroke-width="1.8" marker-end="url(#a-22d3ee)"/>
<text x="646" y="462" class="s" fill="#22d3ee" text-anchor="start">trace(url)</text>
<rect x="30" y="464" width="450" height="262" rx="18" fill="#ffb547" fill-opacity=".035" stroke="#ffb547" stroke-opacity=".45" stroke-dasharray="6 6"/><text x="48" y="490" class="g" fill="#ffb547">MEASUREMENT</text>
<g transform="translate(50 500)"><rect width="410" height="56" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="32" rx="1.5" fill="#ffb547"/><text x="16" y="26" class="h">Public corpora, fetched at run time</text><text x="16" y="46" class="s">Nazario phishing and SpamAssassin ham. Never bundled.</text></g>
<g transform="translate(50 568)"><rect width="410" height="56" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="32" rx="1.5" fill="#ffb547"/><text x="16" y="26" class="h">Sender-grouped splits</text><text x="16" y="46" class="s">dedupe, drop label conflicts, hash into train, validation, test</text></g>
<g transform="translate(50 636)"><rect width="410" height="70" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".14"/><rect x="0" y="12" width="3" height="46" rx="1.5" fill="#ffb547"/><text x="16" y="26" class="h">Metrics and cost model</text><text x="16" y="46" class="s">test split only, bootstrap intervals, ablation, analyst-minutes</text><text x="16" y="62" class="s">writes report.json, which the Evaluation page reads</text></g>
<path d="M255 556 V568" fill="none" stroke="#ffb547" stroke-opacity=".75" stroke-width="1.8" marker-end="url(#a-ffb547)"/>
<path d="M255 624 V636" fill="none" stroke="#ffb547" stroke-opacity=".75" stroke-width="1.8" marker-end="url(#a-ffb547)"/>
</svg>